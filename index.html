<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Banca">
<title>Banca</title>
<style>
  :root{
    --bg:#100E0C;
    --card:#1B1815;
    --card-line:#2A2622;
    --ink:#F2EDE6;
    --ink-dim:#9A9187;
    --gold:#D4A657;
    --green:#5FBF7E;
    --red:#E0685A;
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); overscroll-behavior-y:none;}
  body{padding-bottom:100px;}

  .top{padding:22px 20px 8px;}
  .top .label{font-size:14px; color:var(--ink-dim); margin:0 0 2px;}
  .balance-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .balance{font-family:var(--font-num); font-size:52px; line-height:1; letter-spacing:-0.5px;}
  .balance small{font-size:26px; color:var(--ink-dim); font-weight:400;}
  .goal-pill{border:1px solid var(--card-line); border-radius:20px; padding:6px 14px; font-size:13px; color:var(--gold); white-space:nowrap;}

  .progress-wrap{margin:16px 20px 0; height:6px; background:var(--card-line); border-radius:4px; overflow:hidden;}
  .progress-bar{height:100%; background:linear-gradient(90deg, #8A6A2E, var(--gold)); border-radius:4px; transition:width .4s ease;}
  .progress-caption{margin:8px 20px 0; font-size:12.5px; color:var(--ink-dim); display:flex; justify-content:space-between;}

  .notice{margin:18px 20px 0; background:rgba(212,166,87,0.09); border:1px solid rgba(212,166,87,0.25); color:#E4C583; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5;}

  .section-title{margin:26px 20px 10px; font-size:13px; color:var(--ink-dim); font-weight:600;}

  .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 20px;}
  .action-btn{background:var(--card); border:1px solid var(--card-line); border-radius:14px; padding:14px 6px; text-align:center; color:var(--ink); font-size:13.5px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .action-btn .ic{font-size:20px;}
  .action-btn:active{background:#242019;}
  .action-btn.deposito .ic{color:var(--green);}
  .action-btn.aposta .ic{color:var(--gold);}
  .action-btn.saque .ic{color:var(--red);}

  .list{padding:0 20px; margin-top:6px;}
  .empty{color:var(--ink-dim); font-size:14px; padding:30px 0; text-align:center;}
  .item{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--card-line);}
  .item:last-child{border-bottom:none;}
  .item-left{display:flex; flex-direction:column; gap:2px;}
  .item-type{font-size:14.5px; font-weight:600;}
  .item-date{font-size:12px; color:var(--ink-dim);}
  .item-val{font-family:var(--font-num); font-size:17px;}
  .item-val.pos{color:var(--green);}
  .item-val.neg{color:var(--red);}
  .item-val.neutral{color:var(--ink);}
  .item-del{background:none; border:none; color:var(--ink-dim); font-size:18px; padding:4px 8px; margin-left:6px;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; z-index:50;}
  .sheet-backdrop.open{display:flex;}
  .sheet{background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--card-line);}
  .sheet h3{margin:0 0 16px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--ink-dim); margin-bottom:6px;}
  .field input, .field select{width:100%; background:#141210; border:1px solid var(--card-line); border-radius:10px; padding:12px 12px; color:var(--ink); font-size:16px; font-family:var(--font-ui);}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:600; font-family:var(--font-ui);}
  .btn.cancel{background:transparent; color:var(--ink-dim); border:1px solid var(--card-line);}
  .btn.confirm{background:var(--gold); color:#1B1408;}

  .radio-row{display:flex; gap:8px;}
  .radio-opt{flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--card-line); font-size:14px; color:var(--ink-dim);}
  .radio-opt.active{border-color:var(--gold); color:var(--gold); background:rgba(212,166,87,0.08);}

  .reset-link{display:block; text-align:center; color:var(--ink-dim); font-size:12.5px; margin:34px auto 0; text-decoration:underline;}
</style>
</head>
<body>

  <div class="top">
    <p class="label">Saldo atual</p>
    <div class="balance-row">
      <div class="balance">R$ <span id="saldoVal">0,00</span></div>
      <div class="goal-pill">meta R$ <span id="metaVal">0,00</span></div>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-caption">
    <span id="progressPct">0%</span>
    <span id="progressFalta">faltam R$ 0,00</span>
  </div>

  <div class="notice">A meta de crescimento é recalculada a cada mês: 20% sobre o saldo total da banca, mais R$ 250,00 de aporte planejado para o mês seguinte.</div>

  <p class="section-title">Registrar</p>
  <div class="actions">
    <button class="action-btn deposito" onclick="openSheet('deposito')">
      <span class="ic">＋</span> Depósito
    </button>
    <button class="action-btn aposta" onclick="openSheet('aposta')">
      <span class="ic">⇄</span> Aposta
    </button>
    <button class="action-btn saque" onclick="openSheet('saque')">
      <span class="ic">－</span> Saque
    </button>
  </div>

  <p class="section-title">Histórico</p>
  <div class="list" id="listWrap">
    <div class="empty">Nenhum lançamento ainda.</div>
  </div>

  <a class="reset-link" onclick="confirmReset()">Zerar banca</a>

  <!-- Sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <h3 id="sheetTitle">Novo lançamento</h3>

      <div class="field" id="apostaTypeField" style="display:none;">
        <label>Resultado</label>
        <div class="radio-row">
          <div class="radio-opt active" data-val="ganha" onclick="selectApostaResult(this)">Ganha</div>
          <div class="radio-opt" data-val="perdida" onclick="selectApostaResult(this)">Perdida</div>
        </div>
      </div>

      <div class="field">
        <label id="valorLabel">Valor (R$)</label>
        <input type="number" id="valorInput" inputmode="decimal" placeholder="0,00">
      </div>

      <div class="field">
        <label>Observação (opcional)</label>
        <input type="text" id="obsInput" placeholder="Ex: Flamengo x Palmeiras">
      </div>

      <div class="sheet-actions">
        <button class="btn cancel" onclick="closeSheet()">Cancelar</button>
        <button class="btn confirm" onclick="confirmEntry()">Salvar</button>
      </div>
    </div>
  </div>

<script>
  const BANCA_INICIAL = 250;
  const APORTE_MENSAL = 250;
  const META_PERCENT = 0.20;

  let state = JSON.parse(localStorage.getItem('banca_state') || 'null') || {
    lancamentos: [],
    saldo: BANCA_INICIAL,
    metaAtual: BANCA_INICIAL * (1 + META_PERCENT) + APORTE_MENSAL
  };

  let currentType = null;
  let apostaResult = 'ganha';

  function fmt(v){
    return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function save(){
    localStorage.setItem('banca_state', JSON.stringify(state));
    render();
  }

  function render(){
    document.getElementById('saldoVal').textContent = fmt(state.saldo);
    document.getElementById('metaVal').textContent = fmt(state.metaAtual);

    let pct = state.metaAtual > 0 ? Math.min(100, Math.max(0, (state.saldo / state.metaAtual) * 100)) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct.toFixed(0) + '%';
    let falta = Math.max(0, state.metaAtual - state.saldo);
    document.getElementById('progressFalta').textContent = falta > 0 ? ('faltam R$ ' + fmt(falta)) : 'meta atingida';

    const listWrap = document.getElementById('listWrap');
    if(state.lancamentos.length === 0){
      listWrap.innerHTML = '<div class="empty">Nenhum lançamento ainda.</div>';
      return;
    }
    listWrap.innerHTML = state.lancamentos.slice().reverse().map(l => {
      let sign = l.tipo === 'saque' || (l.tipo === 'aposta' && l.resultado === 'perdida') ? '-' : '+';
      let cls = sign === '+' ? 'pos' : 'neg';
      if(l.tipo === 'deposito') cls = 'pos';
      let label = '';
      if(l.tipo === 'deposito') label = 'Depósito';
      if(l.tipo === 'saque') label = 'Saque';
      if(l.tipo === 'aposta') label = 'Aposta · ' + (l.resultado === 'ganha' ? 'Ganha' : 'Perdida');
      let date = new Date(l.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
      return `<div class="item">
        <div class="item-left">
          <div class="item-type">${label}${l.obs ? ' — ' + l.obs : ''}</div>
          <div class="item-date">${date}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <div class="item-val ${cls}">${sign} R$ ${fmt(l.valor)}</div>
          <button class="item-del" onclick="removeEntry('${l.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  function openSheet(type){
    currentType = type;
    apostaResult = 'ganha';
    document.getElementById('valorInput').value = '';
    document.getElementById('obsInput').value = '';
    const titles = {deposito:'Novo depósito', aposta:'Registrar aposta', saque:'Novo saque'};
    document.getElementById('sheetTitle').textContent = titles[type];
    document.getElementById('apostaTypeField').style.display = type === 'aposta' ? 'block' : 'none';
    document.getElementById('valorLabel').textContent = type === 'aposta' ? 'Resultado financeiro (R$)' : 'Valor (R$)';
    if(type === 'aposta'){
      document.querySelectorAll('.radio-opt').forEach(el => el.classList.toggle('active', el.dataset.val === 'ganha'));
    }
    document.getElementById('sheetBackdrop').classList.add('open');
  }

  function closeSheet(){
    document.getElementById('sheetBackdrop').classList.remove('open');
  }

  function selectApostaResult(el){
    apostaResult = el.dataset.val;
    document.querySelectorAll('.radio-opt').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  }

  function confirmEntry(){
    let valor = parseFloat(document.getElementById('valorInput').value.replace(',', '.'));
    if(isNaN(valor) || valor <= 0){
      document.getElementById('valorInput').focus();
      return;
    }
    let obs = document.getElementById('obsInput').value.trim();
    let entry = { id: Date.now().toString(), tipo: currentType, valor, obs, data: new Date().toISOString() };

    if(currentType === 'deposito'){
      state.saldo += valor;
    } else if(currentType === 'saque'){
      state.saldo -= valor;
    } else if(currentType === 'aposta'){
      entry.resultado = apostaResult;
      state.saldo += apostaResult === 'ganha' ? valor : -valor;
    }

    state.lancamentos.push(entry);
    closeSheet();
    save();
  }

  function removeEntry(id){
    let entry = state.lancamentos.find(l => l.id === id);
    if(!entry) return;
    if(entry.tipo === 'deposito') state.saldo -= entry.valor;
    if(entry.tipo === 'saque') state.saldo += entry.valor;
    if(entry.tipo === 'aposta') state.saldo += entry.resultado === 'ganha' ? -entry.valor : entry.valor;
    state.lancamentos = state.lancamentos.filter(l => l.id !== id);
    save();
  }

  function confirmReset(){
    if(confirm('Isso vai apagar todos os lançamentos e reiniciar a banca em R$ ' + fmt(BANCA_INICIAL) + '. Confirmar?')){
      state = { lancamentos: [], saldo: BANCA_INICIAL, metaAtual: BANCA_INICIAL * (1 + META_PERCENT) + APORTE_MENSAL };
      save();
    }
  }

  render();
</script>
</body>
</html>
